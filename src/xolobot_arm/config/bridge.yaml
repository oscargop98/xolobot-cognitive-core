# ros_gz_bridge config — mapeo explícito de tópicos de Gazebo Harmonic a ROS 2
# Formato: gz_topic_name → ros_topic_name con tipos correctos

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /bumper_states_antebrazo
  gz_topic_name: /world/default/model/xolobot_arm/link/link_antebrazo_izq/sensor/antebrazo_sensor/contact
  ros_type_name: ros_gz_interfaces/msg/Contacts
  gz_type_name: gz.msgs.Contacts
  direction: GZ_TO_ROS

